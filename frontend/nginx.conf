server {
    listen 80;
    root /usr/share/nginx/html;

    # nginx's default table has no entry for .mjs, and browsers refuse to run
    # the map's module worker unless it is served as JavaScript. A types block
    # replaces the inherited table, so the defaults are included again here.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The app calls the API on its own origin
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Built assets have content hashes in their names
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}

[project]
name = "earlywarnings-changes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=2.3.0,<3.0.0",
    "flask-cors>=4.0.0",
    "folium>=0.14.0",
    "geopandas>=0.13.0",
    "langchain>=0.3.0",
    "langchain-ollama>=0.2.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "ruff>=0.15.0",
    "safety>=2.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []

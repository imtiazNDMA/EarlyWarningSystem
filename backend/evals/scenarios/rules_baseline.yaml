                - 175
                - 175
                - 175
        expected:
          - {hazard: poor_air_quality, severity: severe}

  - id: missing-source-is-calm
    districts:
      - id: lahore
        province: Punjab
        source_payloads: {}
        expected: []

  - id: compound-rain-and-heat
    districts:
      - id: jacobabad
        province: Sindh
        source_payloads:
          open-meteo-forecast:
            daily:
              <<: *calm_daily
              temperature_2m_max: [47]
              precipitation_sum: [130]
        expected:
          - {hazard: heatwave, severity: severe}
          - {hazard: heavy_rain, severity: severe}

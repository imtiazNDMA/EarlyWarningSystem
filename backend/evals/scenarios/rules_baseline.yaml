                - "2026-10-08T18:00"
                - "2026-10-08T19:00"
                - "2026-10-08T20:00"
                - "2026-10-08T21:00"
                - "2026-10-08T22:00"
                - "2026-10-08T23:00"
              pm2_5:
                - 175
                - 175
                - 175
                - 175
                - 175

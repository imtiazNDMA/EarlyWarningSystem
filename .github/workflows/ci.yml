name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create environment and install dependencies
        run: uv sync --all-extras --dev

      - name: Create test environment file
        run: |
          echo "OLLAMA_MODEL=test_model" > .env
          echo "OLLAMA_BASE_URL=http://localhost:11434" >> .env
          echo "MAPBOX_TOKEN=test_token" >> .env
          echo "SECRET_KEY=test_secret_key_for_testing" >> .env

      - name: Lint and format check with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Security check with safety
        run: uv run safety check

      - name: Run tests with pytest
        run: |
          uv run pytest tests/ -v --cov=. --cov-report=xml --cov-report=term
        env:
          SECRET_KEY: test_secret_key_for_testing

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml

  backend:
    name: Backend lint, type check & test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ews
          POSTGRES_PASSWORD: ews
          POSTGRES_DB: ews
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ews -d ews"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      EWS_TEST_ADMIN_DATABASE_URL: postgresql://ews:ews@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint and format check with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check with mypy
        run: uv run mypy

      - name: Run tests with pytest
        run: uv run pytest -v

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ews
      POSTGRES_PASSWORD: ews
      POSTGRES_DB: ews
    ports:
      - "${EWS_DB_PORT:-5434}:5432"
    volumes:
      - ews-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ews -d ews"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./backend
    environment:
      EWS_DATABASE_URL: postgresql+asyncpg://ews:ews@db:5432/ews
    ports:
      - "${EWS_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "${EWS_WEB_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  ews-db:

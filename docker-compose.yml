services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ews
      POSTGRES_PASSWORD: ews
      POSTGRES_DB: ews
    ports:
      - "${EWS_DB_PORT:-5434}:5432"
    volumes:
      - ews-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ews -d ews"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./backend
    environment:
      EWS_DATABASE_URL: postgresql+asyncpg://ews:ews@db:5432/ews
      # Needed to trigger cycles over HTTP; admin actions are disabled while unset
      EWS_ADMIN_TOKEN: ${EWS_ADMIN_TOKEN:-}
      # Language model: LM Studio on the host by default, or Groq with a key
      EWS_LLM_PROVIDER: ${EWS_LLM_PROVIDER:-lm_studio}
      EWS_LLM_BASE_URL: ${EWS_LLM_BASE_URL:-}
      EWS_LLM_MODEL: ${EWS_LLM_MODEL:-}
      EWS_LLM_API_KEY: ${EWS_LLM_API_KEY:-}
    ports:
      - "${EWS_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 20

  web:
    build: ./frontend
    ports:
      - "${EWS_WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  ews-db:
